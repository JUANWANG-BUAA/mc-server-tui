        - paragraph [ref=e215]: Architecture
        - heading [level=2] [ref=e216]:
          - text: The UI is disposable.
          - emphasis [ref=e217]: The server isn't.
        - paragraph [ref=e218]: The TUI and CLI are clients. A local daemon owns tasks and supervision. Each instance has a detached runner that holds Java's stdin/stdout/stderr and a private control socket.
        - list [ref=e219]:
          - listitem [ref=e220]: ✓ Daemon restart → reattach, don't kill Java
          - listitem [ref=e221]: ✓ Process identity must match before any signal
          - listitem [ref=e222]: ✓ World writes go through leases and recovery journals
          - listitem [ref=e223]: ✓ Unix socket is per-user, mode 0600
        - link "Read about lifecycle and supervision" [ref=e224] [cursor=pointer]:
          - /url: docs/#lifecycle-readiness
