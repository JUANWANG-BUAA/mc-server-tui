        - paragraph [ref=e107]: Why it feels different
        - heading [level=2] [ref=e108]:
          - text: Less dashboard.
          - emphasis [ref=e109]: More control room.
        - paragraph [ref=e110]: "Every screen is designed around the job: get a server running, see what it is doing, and keep the world safe when something goes wrong."
      - generic [ref=e111]:
        - article [ref=e112]:
          - generic [ref=e113]: "01"
          - heading "Your server, always in view." [level=3] [ref=e114]
          - paragraph [ref=e115]: The selected server, next action and resources stay visible. Console drafts show their destination and stay bound to it when you switch instances. One compact summary follows background work.
          - generic [ref=e116]: · session shell
        - article [ref=e117]:
          - generic [ref=e118]: "02"
          - heading "The UI is disposable." [level=3] [ref=e119]
          - paragraph [ref=e120]: A per-instance runner owns Java's console. Close the TUI or restart the daemon; the Minecraft process keeps running and reattaches.
          - generic [ref=e121]: · resident supervisor
        - article [ref=e122]:
          - generic [ref=e123]: "03"
          - heading "Downloads with receipts." [level=3] [ref=e124]
          - paragraph [ref=e125]: Paper builds are locked to an exact build, size, and SHA-256. Resume is only used when the source proves the range; the installed bytes are verified before they become an instance.
          - generic [ref=e126]: · verified downloads
        - article [ref=e127]:
          - generic [ref=e128]: "04"
          - heading "See what a restore will change." [level=3] [ref=e129]
          - paragraph [ref=e130]: Choose a verified snapshot by local time. Review which worlds will be replaced before typing RESTORE. Later progress is not merged; technical evidence is available with F3.
          - generic [ref=e131]: · transactional restore
        - article [ref=e132]:
          - generic [ref=e133]: "05"
          - heading "Tasks that survive." [level=3] [ref=e134]
          - paragraph [ref=e135]: Durable SQLite tasks, byte-level progress, speed and source, event cursors, and cooperative cancellation. The TUI can disconnect without losing the transition history.
          - generic [ref=e136]: · durable task queue
        - article [ref=e137]:
          - generic [ref=e138]: "06"
          - heading "A terminal with taste." [level=3] [ref=e139]
          - paragraph [ref=e140]: Seven near-black palettes, a clear composer, and details that open with F3. Logs get room to breathe; pixel Steve welcomes you when the workspace is empty.
          - generic [ref=e141]: · terminal UI
