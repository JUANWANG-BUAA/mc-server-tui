        - paragraph [ref=f17e82]: TUI 依赖 Unix socket 和 Unix 进程语义，本版本不支持 Windows。建议使用至少 80×24 的终端；40×12 可用，但会减少装饰和辅助信息。
        - paragraph [ref=f17e83]: Java 必须与 Minecraft/服务端版本匹配。向导会发现本机 Java 并给出推荐，但服务端版本、 插件/模组和玩家客户端兼容性仍由你确认。
