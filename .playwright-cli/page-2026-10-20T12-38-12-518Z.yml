        - paragraph [ref=f17e39]:
          - text: 适用于
          - code [ref=f17e40]: v0.2.1
          - text: （未签名 alpha pre-release）。 本文描述当前已发布的 alpha，不承诺生产稳定性、数据恢复成功、对所有整合包的兼容， 也不承诺支持所有 Minecraft 版本。
      - generic [ref=f17e41]:
        - generic [ref=f17e42]:
          - generic [ref=f17e43]: 01 / 开始使用
          - heading "托管世界前请先阅读" [level=2] [ref=f17e44]
        - paragraph [ref=f17e45]:
          - code [ref=f17e46]: mc-server-tui
          - text: 是独立的终端 Minecraft Java 服务端管理工具，与 Mojang、 Microsoft、PaperMC、Modrinth、Fabric、Forge 均无隶属关系。Minecraft 及相关商标 归各自权利人所有。
        - paragraph [ref=f17e47]: 你需要自行负责：
        - list [ref=f17e48]:
          - listitem [ref=f17e49]: 阅读并接受 Minecraft EULA；
          - listitem [ref=f17e50]: 只使用你有权使用的服务端软件、插件、模组、整合包、世界和玩家数据；
          - listitem [ref=f17e51]: 在应用之外保留独立备份；
          - listitem [ref=f17e52]: 防火墙、端口转发、公网暴露、密码、权限和主机安全；
          - listitem [ref=f17e53]: 在依赖某个插件、模组、整合包或更新之前，验证它能正常工作。
        - paragraph [ref=f17e54]: 当前 alpha 没有代码签名或 macOS 公证。发布文件提供 SHA-256 完整性校验，但这不等于 可信签名。服务端软件和第三方扩展会以你的用户权限执行。请使用专用账户，不要安装 来源不明的文件。软件按仓库的 MIT OR Apache-2.0 许可证提供，不保证持续可用或数据可恢复。
      - generic [ref=f17e55]:
        - generic [ref=f17e56]:
          - generic [ref=f17e57]: 02 / 开始使用
