      - generic [ref=f13e100]:
        - paragraph [ref=f13e101]: Why it feels different
        - heading [level=2] [ref=f13e102]:
          - text: Less dashboard.
          - emphasis [ref=f13e103]: More control room.
        - paragraph [ref=f13e104]: "Every screen is designed around the job: get a server running, see what it is doing, and keep the world safe when something goes wrong."
      - generic [ref=f13e105]:
        - article [ref=f13e106]:
          - generic [ref=f13e107]: "01"
          - heading "Your server, always in view." [level=3] [ref=f13e108]
          - paragraph [ref=f13e109]: The selected server, next action and resources stay visible. Console drafts show their destination and stay bound to it when you switch instances. One compact summary follows background work.
          - generic [ref=f13e110]: · session shell
        - article [ref=f13e111]:
          - generic [ref=f13e112]: "02"
          - heading "The UI is disposable." [level=3] [ref=f13e113]
          - paragraph [ref=f13e114]: A per-instance runner owns Java's console. Close the TUI or restart the daemon; the Minecraft process keeps running and reattaches.
          - generic [ref=f13e115]: · resident supervisor
        - article [ref=f13e116]:
          - generic [ref=f13e117]: "03"
          - heading "Downloads with receipts." [level=3] [ref=f13e118]
          - paragraph [ref=f13e119]: Paper builds are locked to an exact build, size, and SHA-256. Resume is only used when the source proves the range; the installed bytes are verified before they become an instance.
          - generic [ref=f13e120]: · verified downloads
        - article [ref=f13e121]:
          - generic [ref=f13e122]: "04"
          - heading "See what a restore will change." [level=3] [ref=f13e123]
          - paragraph [ref=f13e124]: Choose a verified snapshot by local time. Review which worlds will be replaced before typing RESTORE. Later progress is not merged; technical evidence is available with F3.
          - generic [ref=f13e125]: · transactional restore
        - article [ref=f13e126]:
          - generic [ref=f13e127]: "05"
          - heading "Tasks that survive." [level=3] [ref=f13e128]
          - paragraph [ref=f13e129]: Durable SQLite tasks, byte-level progress, speed and source, event cursors, and cooperative cancellation. The TUI can disconnect without losing the transition history.
          - generic [ref=f13e130]: · durable task queue
        - article [ref=f13e131]:
          - generic [ref=f13e132]: "06"
          - heading "A terminal with taste." [level=3] [ref=f13e133]
          - paragraph [ref=f13e134]: Seven near-black palettes, a clear composer, and details that open with F3. Logs get room to breathe; pixel Steve welcomes you when the workspace is empty.
          - generic [ref=f13e135]: · terminal UI
