      - generic [ref=f13e208]:
        - paragraph [ref=f13e209]: Architecture
        - heading [level=2] [ref=f13e210]:
          - text: The UI is disposable.
          - emphasis [ref=f13e211]: The server isn't.
        - paragraph [ref=f13e212]: The TUI and CLI are clients. A local daemon owns tasks and supervision. Each instance has a detached runner that holds Java's stdin/stdout/stderr and a private control socket.
        - list [ref=f13e213]:
          - listitem [ref=f13e214]: ✓ Daemon restart → reattach, don't kill Java
          - listitem [ref=f13e215]: ✓ Process identity must match before any signal
          - listitem [ref=f13e216]: ✓ World writes go through leases and recovery journals
          - listitem [ref=f13e217]: ✓ Unix socket is per-user, mode 0600
        - link "Read about lifecycle and supervision" [ref=f13e218] [cursor=pointer]:
          - /url: docs/#lifecycle-readiness
